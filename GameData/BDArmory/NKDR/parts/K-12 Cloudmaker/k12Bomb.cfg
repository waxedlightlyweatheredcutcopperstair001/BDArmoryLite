MODULE
{
  name = MissileLauncher

  shortName = K12

  thrust = 0 //KN thrust during boost phase
  cruiseThrust = 0 //thrust during cruise phase
  dropTime = 3 //how many seconds after release until engine ignites
  boostTime = 2.2 //seconds of boost phase
  cruiseTime = 80 //seconds of cruise phase
  guidanceActive = false //missile has guidanceActive
  maxTurnRateDPS = 20 //degrees per second


  useSimpleDrag = true
  simpleCoD = 0,0,-3

  missileType = bomb
  homingType = none
}
MODULE
{
  name = BDModuleNuke
  thermalRadius = 270 //clamps AoE to a max of this distance
  yield = 0.0001// yield, in kilotons
  fluence = 0.1 //thermal bloom modifier, reduce for less toasty nukes
  isEMP = false // does this generate an EMP
  reportingName = K12 Cloudmaker //weapon name that appears in competition log
scaleByYield = true
  fluenceTime =0.35
    effectLifetime = 5
  emitTime = 0.35
  fireballEmitTime = 1.5
  //initial flash
  flashModelPath = BDArmory/NKDR/effects/Voidticle
  //shockwave
  shockModelPath = BDArmory/NKDR/effects/Voidticle
  //fireball
  blastModelPath = BDArmory/NKDR/effects/Explosion_Huge
  //mushroom cloud stalk
  plumeModelPath = BDArmory/NKDR/effects/Voidticle
  //ground scatter
  debrisModelPath = BDArmory/NKDR/effects/Voidticle
 //sound
  blastSoundPath = BDArmory/NKDR/sounds/t_12
}
MODULE
{
	name = BDExplosivePart
	tntMass = 1000
