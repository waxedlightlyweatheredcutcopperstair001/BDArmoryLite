PART
{
// Kerbal Space Program - Part Config
//
//

// --- general parameters ---
name = harpGenie
module = Part
author = Harpwner

// --- asset parameters ---
mesh = model.mu
rescaleFactor = 1


// --- node definitions ---
node_attach = 0.0, 0.225, 0, 0, 1, 0, 0
node_stack_top = 0.0, 0.225, 0, 0, 1, 0, 0

// --- editor parameters ---
TechRequired = precisionEngineering
entryCost = 2100
cost = 650
category = Utility
subcategory = 0
title = AIR - 2 Genie Nuclear Missile
manufacturer = North Kerbin Dynamics
description = The Genie is an oldschool nuclear missile to take out bomber formations, we had a few lying around in the back so we decided to put them to use. WARNING: Detonation possible if jiggled
// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
attachRules = 1,1,0,0,1

// --- standard part parameters ---
mass = 0.372
dragModelType = default
maximum_drag = 0.02
minimum_drag = 0.02
angularDrag = 2
crashTolerance = 5
maxTemp = 7200


MODULE
{
  name = MissileLauncher

  shortName = AIR-2 GENIE

  thrust = 67 //KN thrust during boost phase
  cruiseThrust = 9.6 //thrust during cruise phase
  dropTime = 0 //how many seconds after release until engine ignites
  boostTime = 0.5 //seconds of boost phase
  cruiseTime = 3.495 //seconds of cruise phase
  guidanceActive = true //missile has guidanceActive
  maxTurnRateDPS = 10 //degrees per second
audioClipPath = BDArmory/Sounds/rocketLoop
		exhaustPrefabPath = BDArmory/Models/exhaust/smallExhaust
		boostExhaustPrefabPath = BDArmory/Models/exhaust/mediumExhaust
		boostExhaustTransformName = boostTransform
		boostTransformName = boostTransform

  missileType = missile
  homingType = AGM
  agmDescentRatio = 1.85
  optimumAirspeed = 210
  targetingType = laser
  maxOffBoresight = 65

  deployAnimationName = deploy_Genie
  deployedDrag = 0.02
  deployTime = 0.25

  aero = true
		liftArea = 0.0048
		steerMult = .75
		maxTorque = 15

  minStaticLaunchRange = 800
  maxStaticLaunchRange = 5500

}

MODULE
{
  name = BDModuleNuke
  thermalRadius = 350 //clamps AoE to a max of this distance
  yield = 1// yield, in kilotons
  fluence = 0.5 //thermal bloom modifier, reduce for less toasty nukes
  isEMP = true // does this generate an EMP
  reportingName = Genie Nuclear //weapon name that appears in competition log
scaleByYield = true
  fluenceTime =0.35
    effectLifetime = 10
  emitTime = 0.35
  fireballEmitTime = 1.5
  //initial flash
  flashModelPath = BDArmory/NKDR/effects/Voidticle
  //shockwave
  shockModelPath = BDArmory/NKDR/effects/Voidticle
  //fireball
  blastModelPath = BDArmory/NKDR/effects/Explosion_Genie
  //mushroom cloud stalk
  plumeModelPath = BDArmory/NKDR/effects/Voidticle
  //ground scatter
  debrisModelPath = BDArmory/NKDR/effects/Voidticle
 //sound
  blastSoundPath = BDArmory/NKDR/sounds/explosion_MOAB
}
MODULE
{
	name = BDExplosivePart
	tntMass = 1000000
}
}
