PART
{
// Kerbal Space Program - Part Config
//
//

// --- general parameters ---
name = FAB-5000Bomb
module = Part
author = Quabbo

// --- asset parameters ---
mesh = model5000.mu
rescaleFactor = 1


// --- node definitions ---
node_attach = 0.0, 0.6, -0.45, 0, 1, 0, 0
node_stack_top = 0.0, 0.6, 0.45, 0, 1, 0, 0

// --- editor parameters ---
TechRequired = precisionEngineering
entryCost = 2100
cost = 950
category = none
subcategory = 0
title = FAB-5000 Bomb
manufacturer = North Kerbin Dynamics
description = 5000kg unguided russian bomb. That thing is HUGE!
// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
attachRules = 1,1,0,0,1

// --- standard part parameters ---
mass = 4.8
dragModelType = default
maximum_drag = 0.02
minimum_drag = 0.02
angularDrag = 1
crashTolerance = 5
maxTemp = 3600

MODULE
{
  name = MissileLauncher

  shortName = FAB-5000

  thrust = 0 //KN thrust during boost phase
  cruiseThrust = 0 //thrust during cruise phase
  dropTime = 3 //how many seconds after release until engine ignites
  boostTime = 2.2 //seconds of boost phase
  cruiseTime = 80 //seconds of cruise phase
  guidanceActive = false //missile has guidanceActive
  maxTurnRateDPS = 20 //degrees per second


  useSimpleDrag = true
  simpleCoD = 0,0,-2
  simpleStableTorque = 5
  rndAngVel = 2

  missileType = bomb
  homingType = none
}
MODULE
{
  name = BDModuleNuke
  thermalRadius = 160 //clamps AoE to a max of this distance
  yield = 0.005// yield, in kilotons
  fluence = 0.2 //thermal bloom modifier, reduce for less toasty nukes
  isEMP = false // does this generate an EMP
  reportingName = FAB-5000 //weapon name that appears in competition log
  scaleByYield = false
  fluenceTime =0.2
  emitTime = 0.35
  fireballEmitTime = 1.5
  effectLifetime = 7
  //initial flash
  flashModelPath = BDArmory/NKDR/effects/Voidticle
  //shockwave
  shockModelPath = BDArmory/NKDR/effects/Voidticle
  //fireball
  blastModelPath = BDArmory/NKDR/effects/Explosion_FAB5000
  //mushroom cloud stalk
  plumeModelPath = BDArmory/NKDR/effects/Voidticle
  //ground scatter
  debrisModelPath = BDArmory/NKDR/effects/Voidticle
 //sound
  blastSoundPath = BDArmory/NKDR/sounds/explosion_MOAB
}


}
