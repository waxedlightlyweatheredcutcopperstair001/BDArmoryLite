PART
{
// Kerbal Space Program - Part Config
//
//

// --- general parameters ---
name = b83Nuke
	bdacategory = Bombs
	VABORGANIZER
	{
		organizerSubcategory = bdaBombs
	}
module = Part
author = Harpwner

// --- asset parameters ---
mesh = model.mu
rescaleFactor = 1


// --- node definitions ---
node_attach = 0.0, 0.175, -0.35, 0, 1, 0, 0
node_stack_top = 0.0, 0.175, -0.35, 0, 1, 0, 0

// --- editor parameters ---
TechRequired = precisionEngineering
entryCost = 2100
cost = 650
category = Utility
subcategory = 0
title = B-83 Nuclear Bomb
manufacturer = North Kerbin Dynamics
description = An unguided nuclear bomb that can be dropped by conventional fighters, this has a yield of  1.2Mt.
// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
attachRules = 1,1,0,0,1

// --- standard part parameters ---
mass = 1.1
dragModelType = none
maximum_drag = 0.02
minimum_drag = 0.02
angularDrag = 2
crashTolerance = 5
maxTemp = 3600


MODULE
{
  name = MissileLauncher

  shortName = B83 nuclear Bomb

  thrust = 0 //KN thrust during boost phase
  cruiseThrust = 0 //thrust during cruise phase
  dropTime = 1 //how many seconds after release until engine ignites
  boostTime = 0 //seconds of boost phase
  cruiseTime = 80 //seconds of cruise phase
  guidanceActive = true //missile has guidanceActive
  maxTurnRateDPS = 10 //degrees per second



  missileType = bomb
  DetonationDistance = 0
  targetingType = gps
  homingType = AGMBallistic
  optimumAirspeed = 300


  aero = true
  liftArea = 0.004
  steerMult = 4
  maxTorque = 8

  engageAir = false
  engageMissile = false
  engageGround = true
  engageSLW = false

}
MODULE
{
  name = BDModuleNuke
  thermalRadius = 7450 //clamps AoE to a max of this distance
  yield = 1200// yield, in kilotons
  fluence = 1 //thermal bloom modifier, reduce for less toasty nukes
  isEMP = true // does this generate an EMP
  reportingName = B83 //weapon name that appears in competition log
  scaleByYield = true
  fluenceTime =0.35
    effectLifetime = 30
  emitTime = 0.35
  fireballEmitTime = 1.5
  //initial flash
  flashModelPath = BDArmoryLite/NKDR/effects/Voidticle
  //shockwave
  shockModelPath = BDArmoryLite/NKDR/effects/Voidticle
  //fireball
  blastModelPath = BDArmoryLite/NKDR/effects/Explosion_Megaton
  //mushroom cloud stalk
  plumeModelPath = BDArmoryLite/NKDR/effects/Voidticle
  //ground scatter
  debrisModelPath = BDArmoryLite/NKDR/effects/Voidticle
 //sound
  blastSoundPath = BDArmoryLite/NKDR/sounds/explosion_MOAB
}
MODULE
{
	name = BDExplosivePart
	tntMass = 1200000000
}

