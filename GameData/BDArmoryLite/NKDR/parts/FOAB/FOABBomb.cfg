// --- editor parameters ---
TechRequired = precisionEngineering
entryCost = 2100
cost = 650
category = Utility
subcategory = 0
title = FOAB
manufacturer = North Kerbin Dynamics
description = Smaller than the MOAB, but much more deadly, the FOAB is a type of thermobaric bomb that has a high explosive yeild, making it have double the blast radius than the MOAB.
// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
attachRules = 1,1,0,0,1

// --- standard part parameters ---
mass = 7.1
dragModelType = none
maximum_drag = 0.02
minimum_drag = 0.02
angularDrag = 2
crashTolerance = 5
maxTemp = 3600


MODULE
{
  name = MissileLauncher

  shortName = FOAB

  thrust = 0 //KN thrust during boost phase
  cruiseThrust = 0 //thrust during cruise phase
  dropTime = 1 //how many seconds after release until engine ignites
  boostTime = 0 //seconds of boost phase
  cruiseTime = 80 //seconds of cruise phase
  guidanceActive = true //missile has guidanceActive
  maxTurnRateDPS = 10 //degrees per second


 missileType = bomb
 targetingType = gps
 homingType = AGMBallistic
 optimumAirspeed = 250

  aero = true
  liftArea = 0.013
  steerMult = 2
  maxTorque = 10
}
MODULE
{
  name = BDModuleNuke
  thermalRadius = 350 //clamps AoE to a max of this distance
  yield = 0.044// yield, in kilotons
  fluence = 0.1 //thermal bloom modifier, reduce for less toasty nukes
  isEMP = false // does this generate an EMP
  reportingName = Father Of All Bombs //weapon name that appears in competition log
 scaleByYield = true
  fluenceTime =0.35
    effectLifetime = 15
  emitTime = 0.35
  fireballEmitTime = 1.5
  //initial flash
  flashModelPath = BDArmoryLite/NKDR/effects/Voidticle
  //shockwave
  shockModelPath = BDArmoryLite/NKDR/effects/Voidticle
  //fireball
  blastModelPath = BDArmoryLite/NKDR/effects/Explosion_FOAB
  //mushroom cloud stalk
  plumeModelPath = BDArmoryLite/NKDR/effects/Voidticle
  //ground scatter
  debrisModelPath = BDArmoryLite/NKDR/effects/Voidticle
 //sound
  blastSoundPath = BDArmoryLite/NKDR/sounds/explosion_MOAB
}
MODULE
