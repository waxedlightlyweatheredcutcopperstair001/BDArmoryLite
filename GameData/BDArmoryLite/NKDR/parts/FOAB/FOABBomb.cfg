PART
{
// Kerbal Space Program - Part Config
//
//

// --- general parameters ---
name = foabBomb
	bdacategory = Bombs
	VABORGANIZER
	{
		organizerSubcategory = bdaBombs
	}
module = Part
author = Harpwner

// --- asset parameters ---
mesh = model.mu
rescaleFactor = 1


// --- node definitions ---
node_attach = 0.0, 0.6, -0.25, 0, 1, 0, 0
