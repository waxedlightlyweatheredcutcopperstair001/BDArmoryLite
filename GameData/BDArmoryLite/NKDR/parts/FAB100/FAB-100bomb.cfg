PART
{
// Kerbal Space Program - Part Config
//
//

// --- general parameters ---
name = FAB-100Bomb
	bdacategory = Bombs
	VABORGANIZER
	{
		organizerSubcategory = bdaBombs
	}
module = Part
author = Quabbo

// --- asset parameters ---
mesh = model100.mu
rescaleFactor = 1


// --- node definitions ---
node_attach = 0.0, 0.25, 0.0, 0, 1, 0, 0
node_stack_top = 0.0, 0.25, 0.0, 0, 1, 0, 0

// --- editor parameters ---
TechRequired = precisionEngineering
entryCost = 2100
cost = 950
category = Utility // BDArmory Lite (was none)
subcategory = 0
title = FAB-100 Bomb
manufacturer = North Kerbin Dynamics
description = 100kg unguided russian bomb.
// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
attachRules = 1,1,0,0,1

// --- standard part parameters ---
mass = 0.185
dragModelType = default
maximum_drag = 0.02
minimum_drag = 0.02
angularDrag = 1
crashTolerance = 5
maxTemp = 3600

MODULE
{
  name = MissileLauncher

  shortName = FAB-100

  thrust = 0 //KN thrust during boost phase
  cruiseThrust = 0 //thrust during cruise phase
  dropTime = 3 //how many seconds after release until engine ignites
  boostTime = 2.2 //seconds of boost phase
  cruiseTime = 80 //seconds of cruise phase
  guidanceActive = false //missile has guidanceActive
  maxTurnRateDPS = 20 //degrees per second

  useSimpleDrag = true
  simpleCoD = 0,0,-2
  simpleStableTorque = 5
  rndAngVel = 2

  missileType = bomb
  homingType = none
}
MODULE
{
  name = BDModuleNuke
  thermalRadius = 50 //clamps AoE to a max of this distance
  yield = 0.0001// yield, in kilotons
  fluence = 0.1 //thermal bloom modifier, reduce for less toasty nukes
  isEMP = false // does this generate an EMP
  reportingName = FAB //weapon name that appears in competition log
  //initial flash
  flashModelPath = BDArmoryLite/NKDR/effects/Voidticle
  scaleByYield = true
  fluenceTime =0.35
  effectLifetime = 5
  emitTime = 0.35
  fireballEmitTime = 1.5
  //shockwave
  shockModelPath = BDArmoryLite/NKDR/effects/Voidticle
  //fireball
  blastModelPath = BDArmoryLite/NKDR/effects/Explosion_FAB100
  //mushroom cloud stalk
  plumeModelPath = BDArmoryLite/NKDR/effects/Voidticle
  //ground scatter
  debrisModelPath = BDArmoryLite/NKDR/effects/Voidticle
 //sound
  blastSoundPath = BDArmoryLite/NKDR/sounds/explosion_MOAB
}
MODULE
{
	name = BDExplosivePart
	tntMass = 100
}

}
