PART
{
// Kerbal Space Program - Part Config
//
//

// --- general parameters ---
name = harpScud
	bdacategory = Missiles
	VABORGANIZER
	{
		organizerSubcategory = bdaMissiles
	}
module = Part
author = Harpwner

// --- asset parameters ---
mesh = model.mu
rescaleFactor = 0.45


// --- node definitions ---
node_attach = 0.0, -0.9, 0, 0, 1, 0, 0
node_stack_bottom = 0.0, 0, -8.45, 0, 0, -1, 1

// --- editor parameters ---
TechRequired = precisionEngineering
entryCost = 2100
cost = 950
category = Utility
subcategory = 0
title = Scud Missile (Conventional)
manufacturer = North Kerbin Dynamics
description = A long range, Scud artillery missile that uses GPS coordinates to fire on a target.
// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
attachRules = 1,1,0,0,1

// --- standard part parameters ---
mass = 6.5
dragModelType = default
maximum_drag = 0.01
minimum_drag = 0.01
angularDrag = 2
crashTolerance = 5
maxTemp = 7200



MODULE
{
  name = MissileLauncher

  shortName = Scud Missile

  thrust = 2150 //KN thrust during boost phase
  cruiseThrust = 20 //thrust during cruise phase
  dropTime = 0 //how many seconds after release until engine ignites
  boostTime = 2 //seconds of boost phase
  cruiseTime = 20 //seconds of cruise phase
  guidanceActive = true //missile has guidanceActive
 maxTurnRateDPS = 60

  decoupleSpeed = 0
  decoupleForward = true
audioClipPath = BDArmoryLite/Sounds/rocketLoop


  aero = true
  liftArea = 0
  steerMult = 6
  maxTorque = 2400

  useSimpleDrag = true
  simpleCoD = 0,0,-8

  homingType = AGMBallistic
  optimumAirspeed = 1000

  missileType = missile
targetingType = laser
maxOffBoresight = 360
DetonationDistance = 100
minStaticLaunchRange = 500
maxStaticLaunchRange = 10000
}

MODULE
{
  name = BDModuleNuke
  thermalRadius = 60 //clamps AoE to a max of this distance
  yield = 0.001// yield, in kilotons
  fluence = 0.2 //thermal bloom modifier, reduce for less toasty nukes
  isEMP = true // does this generate an EMP
  reportingName = Scud Missile //weapon name that appears in competition log
  scaleByYield = true
  fluenceTime =0.35
    effectLifetime = 10
  emitTime = 0.35
  fireballEmitTime = 1.5
  //initial flash
  flashModelPath = BDArmoryLite/NKDR/effects/Voidticle
  //shockwave
  shockModelPath = BDArmoryLite/NKDR/effects/Voidticle
  //fireball
  blastModelPath = BDArmoryLite/NKDR/effects/Explosion_Scud
  //mushroom cloud stalk
  plumeModelPath = BDArmoryLite/NKDR/effects/Voidticle
  //ground scatter
  debrisModelPath = BDArmoryLite/NKDR/effects/Voidticle
 //sound
  blastSoundPath = BDArmoryLite/NKDR/sounds/explosion_MOAB
}
MODULE
{
	name = BDExplosivePart
	tntMass = 1000
}


}
